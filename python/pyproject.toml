[build-system]
# Pinned low, not floating: the licence declaration below is the PEP 639 form, which hatchling
# learned in 1.27. An older one accepts `license = "Apache-2.0"` as a *file path* and produces an
# artefact whose licence metadata is a filename - wrong in a way that builds cleanly.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution is "smart-data-engine-sdk"; the import is "sde". Neither half is a style choice
# and both were forced, which is worth knowing before somebody "tidies" them into agreement.
#
# "sde" is already taken on PyPI by someone else, and renaming the import path to something
# squatting-adjacent is worse for a client than a distribution name that differs from it.
#
# The obvious distribution name, "smart-data-engine", is **refused by PyPI** - measured on
# 12 September 2026, a 400 saying "the name is too similar to an existing project". The project it
# collides with is `smartdata-engine`, registered by somebody else with zero releases. PyPI compares
# `ultranormalize_name`, which strips `._-` and maps `l|L|i|I` to 1 and `o|O` to 0, so both names
# reduce to `smartdataeng1ne`. Adding the suffix changes the reduction to `smartdataeng1nesdk`, and
# it matches the repository name, which is the consistency worth having anyway.
#
# `pip install smart-data-engine-sdk` then `import sde`.
name = "smart-data-engine-sdk"
dynamic = ["version"]
description = "Smart Data Engine client library: declare a data model, we place it and move it"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
# Apache-2.0 section 4 asks that the licence travel with the work, and section 4(d) says the same
# about a NOTICE file where one exists. Both were missing from the wheel and the sdist until this
# line: `license = { text = "Apache-2.0" }` puts the *name* of the licence in the metadata and ships
# no licence at all. Measured by unzipping the wheel, because the two are easy to confuse.
#
# The files are copies of the ones in the repository root rather than references to them, since a
# build backend cannot reach outside its own project directory. `test_packaging.py` asserts the
# copies are byte-identical, which is the whole objection to duplicating them answered.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Smart Data Engines" }]
keywords = ["database", "placement", "polystore", "postgresql", "clickhouse"]
# No `License ::` classifier: PEP 639 makes it an error next to a licence expression, and PyPI
# rejects the upload. The licence is `license` above, in one place.
classifiers = [
    # Alpha, and it stays alpha until somebody outside this repository runs it. The suite is large
    # and two engines are live, neither of which is the same claim as "in production somewhere".
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    # The wheel carries `py.typed`, so this row is a fact the artefact can be checked against.
    "Typing :: Typed",
]

# No runtime dependencies on purpose. This library goes into someone else's application, so every
# dependency is a dependency they inherit and a version conflict they may have to resolve. Signature
# verification and engine drivers are extras, because not every deployment needs them: an unsigned,
# hand-written map with no engine driver is a valid way to use this.
dependencies = []

# A page for a library whose argument is "read the code and verify the invariant yourself" has to
# link to the code. Without this block PyPI renders no sidebar links at all, and the reader has the
# long README and nowhere to go.
[project.urls]
Homepage = "https://github.com/Smart-Data-Engines/smart-data-engine-sdk"
Repository = "https://github.com/Smart-Data-Engines/smart-data-engine-sdk"
Issues = "https://github.com/Smart-Data-Engines/smart-data-engine-sdk/issues"
"Format contract" = "https://github.com/Smart-Data-Engines/smart-data-engine-sdk/blob/main/docs/format-contract.md"
"Failure semantics" = "https://github.com/Smart-Data-Engines/smart-data-engine-sdk/blob/main/docs/failure-semantics.md"

[project.optional-dependencies]
signed = ["cryptography>=42"]
postgres = ["psycopg[binary]>=3.1"]
# The official ClickHouse client, over HTTP. Chosen over the native-protocol driver because HTTP is
# what a client is most likely to already have open through a proxy or a load balancer, and because
# the second engine should not also introduce a second network story.
clickhouse = ["clickhouse-connect>=0.7"]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.version]
path = "src/sde/__init__.py"

# The distribution and the import differ, so the package has to be pointed at explicitly. Hatchling
# otherwise looks for a directory named after the project and fails - which it did, and better here
# than at publish time.
[tool.hatch.build.targets.wheel]
packages = ["src/sde"]
# `src/sde/py.typed` needs no entry here: hatchling includes it because it lives inside the package
# directory, which was checked by building the wheel both ways rather than assumed. A `force-include`
# for it was written first and then removed - dead configuration that looks load-bearing is worse than
# none, because the next person reads it as a requirement.
#
# The marker itself is not optional. Without it a consumer's type checker reports `module is installed,
# but missing library stubs or py.typed marker` and treats every symbol here as Any, which is worse
# than shipping no annotations: it is shipping annotations only we benefit from, in a library whose
# argument is that a client can verify our invariants by reading it. CI builds the wheel and looks
# inside, because the source tree and the artefact are only the same until somebody changes this file.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF012 wants ClassVar on mutable class attributes. It is right about ordinary classes and wrong
# about ours: `class Meta: pii = ["email"]` is the library's public declarative API, and this is
# exactly how a client writes it. Annotating it would be teaching people a worse habit to satisfy a
# linter. Off in tests, where the declarations live; the library itself never writes one.
"tests/*" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# The type vocabulary maps Python's types onto neutral names by inspecting annotations, which means
# handling objects mypy cannot narrow. Those places are explicit rather than blanket-ignored.
disallow_any_explicit = false

# The orderbook engine's Python client is not on PyPI and is installed from its own repository, so
# no environment can be relied on to have it - including CI, which installs from an index. Ignoring
# the missing import here rather than vendoring a stub: a stub we wrote would be a second, silently
# stale description of somebody else's API, and the adapter already converts every value crossing
# that boundary (`int(...)`, `str(...)`) precisely because nothing type-checks it.
[[tool.mypy.overrides]]
module = ["orderbook_engine", "orderbook_engine.*"]
ignore_missing_imports = true
