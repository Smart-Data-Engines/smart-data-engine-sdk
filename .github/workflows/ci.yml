name: check

# Every library runs the shared conformance vectors in its own runner. That is the whole mechanism by
# which four implementations stay identical, so it runs on every push rather than on a schedule.
#
# Third-party actions are pinned to full commit SHAs with the version in a trailing comment. A tag is
# a mutable pointer: `@v4` can be moved to different code by whoever controls the repository, and a
# repository this one is judged by should not have a step whose contents can change without a diff
# here. Dependabot understands this form and bumps the SHA and the comment together.

on:
  push:
    branches: [main]
  pull_request:

# Declared here rather than inherited. The repository default is already read-only, which is why
# nothing was exploitable, but a workflow that does not state its permissions is one repository
# setting away from running with a write token - and CodeQL's `actions` analysis flagged all three
# jobs for exactly that (`actions/missing-workflow-permissions`, medium). Nothing here writes to the
# repository: it builds, type-checks and runs tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is 3.11 because the code uses `X | None` at runtime in annotations resolved by
        # get_type_hints. The ceiling is whatever is current: a canonical encoding that drifts with a
        # Python release is exactly the failure the contract exists to prevent, so both ends get run.
        python: ["3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: sde
          POSTGRES_DB: sde
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        # The second engine, and the reason the product exists: between these two lies the decision
        # clients get wrong once, at the start. It is here rather than in a job of its own because the
        # test that matters most needs *both* servers at once - one value written to each, read back,
        # and asserted equal in content and in Python type. Two divergences were living in that gap.
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_PASSWORD: sde
          CLICKHOUSE_DB: sde
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        # 127.0.0.1 rather than localhost, and the difference is the whole reason the first attempt
        # at this failed. `wget` in the alpine image resolves `localhost` to the IPv6 `[::1]`, and
        # ClickHouse listens on IPv4 only, so the probe got "Connection refused" against a server
        # that had started perfectly - GitHub then reported "Failed to initialize container", which
        # points at the image rather than at the health check that was wrong.
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,signed,postgres,clickhouse]'

      - name: lint
        working-directory: python
        run: ruff check --config pyproject.toml src tests ../tools ../conformance/tools/verification_vectors.py ../conformance/tools/fencing_vectors.py ../conformance/tools/generation_vectors.py ../conformance/tools/frozen_vectors.py ../conformance/tools/nfc_map_vectors.py ../conformance/tools/cutover_vectors.py ../conformance/tools/staging_vectors.py ../conformance/tools/index_vectors.py ../conformance/tools/physical_vectors.py ../conformance/tools/physical_packet_vectors.py ../conformance/tools/telemetry_vectors.py ../conformance/tools/unfenced_vectors.py

      - name: types
        working-directory: python
        # Not decoration: several guarantees in this design are enforced by types rather than by
        # runtime checks, so a weakened annotation is a deleted guarantee.
        run: mypy src tests/qualification ../tools ../conformance/tools/verification_vectors.py ../conformance/tools/fencing_vectors.py ../conformance/tools/generation_vectors.py ../conformance/tools/frozen_vectors.py ../conformance/tools/nfc_map_vectors.py ../conformance/tools/cutover_vectors.py ../conformance/tools/staging_vectors.py ../conformance/tools/index_vectors.py ../conformance/tools/physical_vectors.py ../conformance/tools/physical_packet_vectors.py ../conformance/tools/telemetry_vectors.py ../conformance/tools/unfenced_vectors.py

      - name: tests, including both engine slices
        working-directory: python
        env:
          SDE_POSTGRES_DSN: postgresql://postgres:sde@127.0.0.1:5432/sde
          SDE_CLICKHOUSE_DSN: clickhouse://default:sde@127.0.0.1:8123/sde
        run: pytest -v

      - name: the integration slices actually ran
        working-directory: python
        # A skipped integration test is indistinguishable from a passing one in a summary line, and
        # these are the only things here that prove the library works against a real engine. The
        # agreement slice is the most important of the four and the easiest to lose: it needs *both*
        # DSNs, so a single missing variable turns it into a silent skip.
        #
        # `test_failure_semantics` is here because every row of docs/failure-semantics.md that a
        # client reads before buying is either measured by it or paired with a mechanism by it. A
        # document whose evidence skipped is a document with no evidence.
        env:
          SDE_POSTGRES_DSN: postgresql://postgres:sde@127.0.0.1:5432/sde
          SDE_CLICKHOUSE_DSN: clickhouse://default:sde@127.0.0.1:8123/sde
        run: |
          for slice in tests/test_postgres_slice.py tests/test_clickhouse_slice.py tests/test_engine_agreement.py tests/test_failure_semantics.py tests/test_demo_resources.py tests/test_demo_verification.py tests/test_demo_query_count.py tests/test_*_live.py; do
            pytest "$slice" -q --junitxml="$RUNNER_TEMP/sde-integration.xml"
            python ../tools/check_junit.py "$RUNNER_TEMP/sde-integration.xml"
          done


      - name: verified TLS against isolated native engines
        run: python tools/qualify_tls.py --language python --scratch "$RUNNER_TEMP/sde-native-tls"

      - name: application batches on the supported ClickHouse driver floor
        if: matrix.python == '3.11'
        working-directory: python
        env:
          SDE_POSTGRES_DSN: postgresql://postgres:sde@127.0.0.1:5432/sde
          SDE_CLICKHOUSE_DSN: clickhouse://default:sde@127.0.0.1:8123/sde
        run: |
          python -m pip install 'clickhouse-connect==1.7.2'
          pytest tests/test_bulk_live.py tests/test_clickhouse_transport.py tests/test_clickhouse_tls.py -q --junitxml="$RUNNER_TEMP/sde-driver-floor.xml"
          python ../tools/check_junit.py "$RUNNER_TEMP/sde-driver-floor.xml"
          python ../tools/qualify_tls.py --language python --scratch "$RUNNER_TEMP/sde-floor-tls"

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24", "26"]

    # The same two engines the Python job gets, and for the same reason: this library reached Tier 2
    # on 6 September 2026, so "it renders DDL and takes part in a migration" is now a claim about
    # real servers. Running the vectors without them would leave the adapters - two of the eight
    # integrations requirement 17.5 is about - checked by nothing.
    #
    # All five Node versions, deliberately. The ClickHouse adapter exists because the official
    # client requires Node 20, and a matrix that only exercised the engines on one version would be
    # unable to notice the day that stops being the reason.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: sde
          POSTGRES_DB: sde
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_PASSWORD: sde
          CLICKHOUSE_DB: sde
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        # 127.0.0.1 rather than localhost: `wget` in the alpine image resolves `localhost` to the
        # IPv6 `[::1]` and ClickHouse listens on IPv4 only, so the probe fails against a server that
        # started perfectly - and GitHub then reports "Failed to initialize container", which points
        # at the image rather than at the health check that was wrong.
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: install
        working-directory: typescript
        run: npm ci

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Python peer for the live interoperability slice
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install -e './python[signed,postgres,clickhouse]'

      - name: types
        working-directory: typescript
        run: |
          npx tsc --noEmit
          npm run build
          npx tsc --noEmit --allowJs --checkJs --strictNullChecks --target ES2022 --module NodeNext --types node --skipLibCheck tests/qualification/weather-worker.mjs
          npx tsc --noEmit --allowJs --checkJs --strict --target ES2022 --module NodeNext --types node --skipLibCheck tests/qualification/tls-worker.mjs

      - name: verified TLS against isolated native engines
        run: python/.venv/bin/python tools/qualify_tls.py --language typescript --scratch "$RUNNER_TEMP/sde-native-tls"

      - name: the same vectors Python runs, and both engine slices
        working-directory: typescript
        env:
          TZ: America/New_York
          SDE_POSTGRES_DSN: postgresql://postgres:sde@127.0.0.1:5432/sde
          SDE_CLICKHOUSE_DSN: clickhouse://default:sde@127.0.0.1:8123/sde
        run: npx vitest run

      - name: the integration slices actually ran
        working-directory: typescript
        # Read out of the **JSON reporter**, not out of the summary line, and that is the second
        # version of this guard. The first grepped the human output for `Tests +[1-9]` - which
        # matched locally, where the output was piped and therefore plain, and matched nothing in
        # CI, where vitest colours it and the escape codes sit between the word and the number. So
        # the job failed with "ran no tests at all" printed directly beneath sixteen passing tests:
        # a guard that reports on its own formatting instead of on its subject, which is the same
        # class of defect as a test whose setup silently does nothing.
        #
        # A skipped integration test is indistinguishable from a passing one in a summary line, and
        # these are the only things here that prove the adapters work against a real engine. The
        # agreement slice inside `engines.live` is the one that matters most and the easiest to
        # lose: it needs *both* DSNs, so a single missing variable turns it into a silent skip.
        #
        # `failure.test.ts` is deliberately **not** here: nothing in it needs a server, because
        # every socket it waits on is one it starts itself. So it runs in the step above, on every
        # machine, which is a stronger place for it - the bound a client depends on is measured
        # wherever the suite runs rather than only where two databases happen to be. One of its
        # assertions has already caught a defect this adapter would have shipped: `pg` ignores a
        # `connect_timeout` in a connection string, so deferring to it left no bound at all.
        env:
          SDE_POSTGRES_DSN: postgresql://postgres:sde@127.0.0.1:5432/sde
          SDE_CLICKHOUSE_DSN: clickhouse://default:sde@127.0.0.1:8123/sde
        run: |
          for file in tests/*.live.test.ts; do
            slice=${file#tests/}
            slice=${slice%.test.ts}
            npx vitest run "$file" --reporter=json --outputFile="$RUNNER_TEMP/$slice.json"
            node -e '
              const report = require(process.env.RUNNER_TEMP + "/" + process.argv[1] + ".json")
              const slice = process.argv[1]
              if (report.numPendingTests > 0) {
                console.error(slice + ": " + report.numPendingTests +
                  " test(s) skipped, so the adapters were checked by nothing")
                process.exit(1)
              }
              if (report.numPassedTests < 1) {
                console.error(slice + ": ran no tests at all")
                process.exit(1)
              }
              console.log(slice + ": " + report.numPassedTests + " passed, none skipped")
            ' "$slice"
          done

  orderbook:
    # Our own engine, which no package index serves: its Python client lives in its repository and
    # its shared library is built from C++. So this job builds the server and the library from the
    # commit `.github/orderbook-engine.txt` pins, starts two servers - one plain, one with client
    # authentication and TLS - and runs every orderbook slice in-process and over TCP. Until this
    # job existed those slices skipped everywhere but one laptop, and the TCP path shipped broken
    # for the engine of its own day: the adapter sent a sequence number the server refuses.
    #
    # Moving the pin is an ordinary pull request, and this job is what says the adapter still
    # describes the engine it names.
    #
    # PostgreSQL and ClickHouse are here too, for one scenario on all three engines: a group staged,
    # cut over and indexed between the first two while a group on the orderbook, which carries no
    # write generation (map contract 6), stays where it is and keeps working.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: sde
          POSTGRES_DB: sde
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_PASSWORD: sde
          CLICKHOUSE_DB: sde
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: the pinned engine commit
        id: engine
        run: |
          sha="$(tr -d '[:space:]' < .github/orderbook-engine.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "the pin is not a full commit SHA: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Smart-Data-Engines/low-cost-and-low-latency-orderbook-dbengine
          ref: ${{ steps.engine.outputs.sha }}
          path: engine
          persist-credentials: false

      - name: build the server and the shared library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config liblz4-dev libcurl4-openssl-dev
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOB_BUILD_TESTS=OFF
          cmake --build engine/build --target ob_tcp_server orderbook_shared
          engine/build/ob_tcp_server --version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,signed]'

      - name: start a plain server and one with credentials and TLS
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/orderbook"
          mkdir -p "$work/plain" "$work/secure"
          cd "$work"
          # Every extension Python 3.13+ verifies by default (VERIFY_X509_STRICT): a CA without
          # keyUsage, or a leaf without an authority key identifier, fails the handshake there and
          # passes on 3.12 - the first run of this job failed exactly so.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout ca.key \
            -out ca.pem -days 1 -subj "/CN=sde-ci-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout server.key \
            -out server.csr -subj "/CN=localhost" 2>/dev/null
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' \
            'extendedKeyUsage=serverAuth' 'subjectAltName=DNS:localhost' \
            'subjectKeyIdentifier=hash' 'authorityKeyIdentifier=keyid,issuer' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out server.pem -days 1 -extfile ext.cnf 2>/dev/null
          chmod 600 server.key
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          printf 'sde-ci %s\n' "$secret" > secrets
          chmod 600 secrets
          server="$GITHUB_WORKSPACE/engine/build/ob_tcp_server"
          "$server" --port 59090 --data-dir "$work/plain" --profile eco --metrics-port 0 \
            > "$work/plain.log" 2>&1 &
          "$server" --port 59091 --data-dir "$work/secure" --profile eco --metrics-port 0 \
            --auth-secret-file "$work/secrets" --tls-client --tls-cert-file "$work/server.pem" \
            --tls-key-file "$work/server.key" > "$work/secure.log" 2>&1 &
          for port in 59090 59091; do
            for attempt in $(seq 1 50); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then break; fi
              sleep 0.2
            done
            (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null \
              || { echo "no server on $port"; cat "$work"/*.log; exit 1; }
          done
          dsn="orderbook://sde-ci:$secret@localhost:59091?tls=on&ca=$work/ca.pem"
          echo "SDE_ORDERBOOK_SECURE_DSN=$dsn" >> "$GITHUB_ENV"

      - name: the orderbook slices, in-process and over TCP, plain and with TLS
        working-directory: python
        env:
          SDE_ORDERBOOK: "1"
          SDE_ORDERBOOK_TCP: 127.0.0.1:59090
          SDE_POSTGRES_DSN: postgresql://postgres:sde@127.0.0.1:5432/sde
          SDE_CLICKHOUSE_DSN: clickhouse://default:sde@127.0.0.1:8123/sde
        run: |
          export OB_LIB_PATH="$GITHUB_WORKSPACE/engine/build/liborderbook_shared.so"
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/python"
          pytest tests/test_orderbook_slice.py tests/test_orderbook_session_slice.py \
            tests/test_orderbook_tcp.py tests/test_orderbook_adapter.py \
            tests/test_orderbook_three_engines.py \
            -q --junitxml="$RUNNER_TEMP/sde-orderbook.xml"
          python ../tools/check_junit.py "$RUNNER_TEMP/sde-orderbook.xml"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: the built wheel carries the PEP 561 marker
        # The unit test checks the file is in the source tree. This checks it is in the artefact -
        # which is the thing a consumer installs, and the two are only the same until somebody
        # changes the build configuration. A wheel without the marker type-checks fine here and
        # makes every downstream `import sde` untyped.
        run: |
          python3 -m pip install -q build
          python3 -m build --wheel --outdir /tmp/wheel python
          python3 - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob('/tmp/wheel/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          if 'sde/py.typed' not in names:
              print(f'{wheel} has no sde/py.typed. Consumers would see this library as untyped.')
              print('\n'.join(sorted(names)[:40]))
              sys.exit(1)
          print(f'{wheel}: marker present')
          PY

      - name: the ruleset still gates what the workflows produce
        # docs/github-security.md names two ways this configuration fails quietly: a required context
        # nothing produces waits forever, and a job nothing requires runs and gates nothing while
        # looking like coverage. Both were warnings in a document until this step; the second one is
        # created by adding a single matrix entry above.
        run: |
          python3 -m pip install -q pyyaml
          python3 .github/rulesets/check_contexts.py

      - name: the hashing digests are what openssl derives
        # The model/ vectors were produced by the implementation they verify, which is why 001 is
        # hand-written. The hashing/ vectors do not need that workaround: an HMAC is reproducible by
        # anything, so this re-derives every committed digest with openssl and fails on a
        # disagreement. What it checks is the part a port gets wrong - NFC before the HMAC, U+0000 as
        # the separator, the prefix outside the message, fields hashed with their entity - none of
        # which any ASCII-only test can see.
        run: python3 conformance/tools/hashing_vectors.py --verify

      - name: the hand-written vector is unchanged
        # model/001-single-entity was typed out from docs/format-contract.md rather than generated,
        # which makes it the only independent check that the document is sufficient to implement from.
        # Changing it is changing the contract, and that has to be deliberate enough to require
        # editing this workflow.
        run: |
          expected=54a50916f4326096
          actual=$(sha256sum conformance/vectors/model/001-single-entity/ir.json | cut -c1-16)
          test "$actual" = "$expected" || {
            echo "the hand-written vector changed: $actual != $expected"
            echo "If that was deliberate, bump conformance/contract-version.txt and this check."
            exit 1
          }
