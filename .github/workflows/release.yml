name: release

# Publishing by hand is the right way to claim a name and the wrong way to ship a release. Both names
# were claimed by hand on 12 September 2026; from here on a release is a tag, and nothing else.
#
# The filename matters. Both registries pin the trusted publisher to a *workflow filename*, so
# renaming this file revokes publishing on PyPI and on npm at the same time, and the symptom is a
# failed release rather than a warning. `python/tests/test_release.py` asserts the name for that
# reason.
#
# There is deliberately no `workflow_dispatch`. A manual trigger is a publish with no tag behind it,
# which is exactly the gate below being skipped by the person it exists to protect.
#
# Third-party actions are pinned to full commit SHAs with the version in a trailing comment, as in
# `ci.yml`. Note `pypa/gh-action-pypi-publish` v1.14.2 is an *annotated* tag: the commit is
# dc37677b and the tag object is a892a5a6. Resolve with `git ls-remote '...^{}'` - taking the tag
# object pins nothing that Dependabot can bump, and the symptom is Dependabot offering v1.14.2 as an
# upgrade from v1.14.2.

on:
  push:
    tags:
      # Per-language, because the two distributions version independently. `v*` is here only so that
      # the gate can refuse it by name: a tag that triggers nothing is a release that looks done.
      - 'v*'
      - 'python-v*'
      - 'typescript-v*'

permissions:
  contents: read

# Never cancel a publish in flight. `cancel-in-progress: true` here would mean a second tag pushed a
# minute later could interrupt an upload half-way, and neither registry hands a version number back.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The ancestry check below needs history, and a shallow clone answers it wrongly rather
          # than refusing to answer.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: The tag names a package, and the manifest agrees
        id: tag
        run: python3 tools/release_tag.py "${{ github.ref }}" >> "$GITHUB_OUTPUT"

      - name: The tagged commit is on main, so it passed the required checks
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::commit $GITHUB_SHA is not an ancestor of main, so it never passed the"
            echo "::error::required checks. The ruleset protects main; it does not stop a tag"
            echo "::error::from being pointed at any commit in the repository, including one on a"
            echo "::error::branch that was never reviewed. Merge first, then tag the merge."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

  build-python:
    name: build python
    needs: gate
    if: needs.gate.outputs.package == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Build
        working-directory: python
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build

      - name: Open the artefact, because the suite runs the source tree
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          for wheel in python/dist/*.whl; do
            python3 tools/check_artefact.py wheel "$wheel" "$VERSION"
          done
          for sdist in python/dist/*.tar.gz; do
            python3 tools/check_artefact.py sdist "$sdist"
          done
          python -m twine check --strict python/dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: [gate, build-python]
    runs-on: ubuntu-latest
    # A person, not a merge. The environment carries the required reviewer; PyPI's trusted publisher
    # names this environment too, so a token minted by any other job is refused at the registry.
    environment:
      name: pypi
      url: https://pypi.org/project/smart-data-engine-sdk/${{ needs.gate.outputs.version }}/
    permissions:
      # The whole credential. No token exists in this repository or its secrets.
      id-token: write
    steps:
      # Deliberately no checkout and no dependency install. This job holds the publishing identity,
      # so nothing from the repository or from a dependency's lifecycle script runs inside it - it
      # receives a built artefact and hands it to the registry.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  build-npm:
    name: build npm
    needs: gate
    if: needs.gate.outputs.package == 'typescript'
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.dist_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Inside the `engines` range this package declares (>=18 <23). Publishing from outside it
          # makes npm complain about our own constraint.
          node-version: '22'

      - name: Build and pack
        working-directory: typescript
        run: |
          set -euo pipefail
          npm ci
          # `prepack` runs the build, which is the mechanism that stopped this from packing two files.
          npm pack

      - name: Open the tarball
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          for tarball in typescript/*.tgz; do
            python3 tools/check_artefact.py npm "$tarball" "$VERSION"
          done

      - name: The dist-tag, from what the registry already holds
        # npm 11 refuses a prerelease without `--tag`, and a fixed tag is wrong one way or the
        # other: `latest` would put every candidate over the last final, `next` would leave an
        # unpinned install on the version published by hand. `tools/npm_dist_tag.py` decides, and
        # it runs here because the publishing job must not check out this repository.
        id: dist_tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # Public metadata, no credential. A failed lookup stops the release: an empty list would
          # let a prerelease take `latest` from a final.
          published=$(npm view "@smart-data-engines/sde" versions --json)
          python3 tools/npm_dist_tag.py "$VERSION" "$published" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-tarball
          path: typescript/*.tgz
          if-no-files-found: error

  publish-npm:
    name: publish to npm
    needs: [gate, build-npm]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@smart-data-engines/sde/v/${{ needs.gate.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: npm new enough to exchange an OIDC token
        # Node 22 ships npm 10, which has no OIDC support and would fall back to asking for a token
        # that does not exist. Pinned rather than `@latest`: this is the one job holding the
        # publishing identity, and a floating tool version in it is a dependency nobody reviewed.
        run: |
          set -euo pipefail
          npm install -g npm@11.15.0
          npm --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-tarball
          path: .

      - name: What the registry will be asked to trust
        # The claims npm compares with the trusted publisher configured on npmjs.com, printed so that
        # a refusal can be read against them. Only the claims: the token itself is a credential and
        # never leaves this step. Measured on 27 September: 0.1.0-rc.1 was refused twice with
        # nothing in this log but ENEEDAUTH, because npm reports why an exchange failed only at
        # verbose level. The cause was that the package had no trust configuration at all (`npm trust
        # list`: "No trust configurations found"); the website had not saved it.
        run: |
          set -euo pipefail
          SDE_ID_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          export SDE_ID_TOKEN
          python3 - <<'CLAIMS'
          import base64, json, os
          payload = os.environ["SDE_ID_TOKEN"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ("repository", "repository_owner", "workflow_ref", "job_workflow_ref",
                      "environment", "ref", "event_name", "runner_environment"):
              print(f"{key}: {claims.get(key)}")
          CLAIMS

      - name: Publish
        # No NODE_AUTH_TOKEN and no .npmrc. Trusted publishing generates the provenance attestation
        # by itself, so `--provenance` is not passed: npm does it and it cannot be forgotten. The tag
        # is always explicit, chosen by the build job from the registry.
        env:
          DIST_TAG: ${{ needs.build-npm.outputs.dist_tag }}
        run: |
          set -euo pipefail
          test -n "$DIST_TAG"
          tarball=$(ls ./*.tgz)
          npm publish "$tarball" --access public --tag "$DIST_TAG" || {
            # The OIDC exchange never throws: npm logs why it got no token into its debug log, at
            # verbose level, and the console shows only ENEEDAUTH. Those lines carry the registry's
            # message and no credential.
            echo "::group::npm's own account of the OIDC exchange"
            grep -h "oidc" "$HOME"/.npm/_logs/*-debug-0.log || true
            echo "::endgroup::"
            exit 1
          }

      - name: It is actually there, under its tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          DIST_TAG: ${{ needs.build-npm.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # Bounded, and longer than the registry's cache. The package document is served with
          # `cache-control: public, max-age=300`, and the build job has just fetched it, so for up
          # to five minutes an edge can answer with the list from before this publish. Measured on
          # the hand-made 0.1.0-dev.0: published at 17:57:51Z, visible at 18:02:58Z. Forty tries
          # ten seconds apart outlast that, and a check that waits for ever is not a check.
          for attempt in $(seq 1 40); do
            published=$(npm view "@smart-data-engines/sde@$VERSION" version 2>/dev/null || true)
            tagged=$(npm view "@smart-data-engines/sde" "dist-tags.$DIST_TAG" 2>/dev/null || true)
            if [ "$published" = "$VERSION" ] && [ "$tagged" = "$VERSION" ]; then
              echo "@smart-data-engines/sde@$published is on the registry as $DIST_TAG"
              exit 0
            fi
            sleep 10
          done
          echo "::error::after 40 attempts the registry shows version '$published' and $DIST_TAG '$tagged', not $VERSION"
          exit 1
